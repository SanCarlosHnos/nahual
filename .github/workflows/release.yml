name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Run verification
      run: npm run verificar
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Nahual ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Cambios en esta versión
          
          Ver el [changelog completo](https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.VERSION }}).
          
          ## Instalación
          
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd nahual
          npm install
          npm start
          ```
          
          ## Requisitos
          
          - Node.js 20.x o superior
          - Ollama corriendo localmente
        draft: false
        prerelease: false
