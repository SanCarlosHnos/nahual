name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Run verification
      run: npm run verificar
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Build Electron app
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: Nahual ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Cambios en esta versión
          
          Ver el [changelog completo](https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.VERSION }}).
          
          ## Instalación
          
          ### Opción 1: Instalador (recomendado)
          Descarga `Nahual-Setup-${{ steps.get_version.outputs.VERSION }}.exe` y ejecútalo.
          
          ### Opción 2: Portable
          Descarga `Nahual-Portable-${{ steps.get_version.outputs.VERSION }}.exe` y ejecútalo directamente.
          
          ### Opción 3: Desde código fuente
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd nahual
          npm install
          npm start
          ```
          
          ## Requisitos
          
          - Windows 10/11 (64-bit)
          - Ollama corriendo localmente
        draft: false
        prerelease: false
        files: |
          dist/*.exe
          dist/*.zip
          dist/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
