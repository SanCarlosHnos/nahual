name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Run verification
      run: npm run verificar
    
    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
    
    - name: Set package version
      run: npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
    
    - name: Build Electron app
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v3
      with:
        name: Nahual ${{ steps.get_version.outputs.TAG }}
        body: |
          ## Cambios en esta versión
          
          Ver el [changelog completo](https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.TAG }}).
          
          ## Instalación
          
          ### Portable (recomendado)
          Descarga `Nahual-Portable-${{ steps.get_version.outputs.VERSION }}.exe` y ejecútalo directamente.
          No requiere instalación.
          
          ### Desde código fuente
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd nahual
          npm install
          npm start
          ```
          
          ## Requisitos
          
          - Windows 10/11 (64-bit)
          - Ollama corriendo localmente
        draft: false
        prerelease: false
        files: |
          dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Sync version to master
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
        git fetch origin master
        git checkout -B master origin/master
        node -e "const p=require('./package.json'); p.version='${{ steps.get_version.outputs.VERSION }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"
        git add package.json
        git diff --cached --quiet || (git commit -m "chore: bump version to ${{ steps.get_version.outputs.VERSION }} [skip ci]" && git push origin master)
