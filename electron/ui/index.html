<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Nahual</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Panel del avatar -->
      <aside id="panel-avatar">
        <div id="avatar" data-estado="quieto">
          <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <radialGradient id="cuerpo" cx="50%" cy="38%" r="70%">
                <stop offset="0%" stop-color="#8b7bff" />
                <stop offset="55%" stop-color="#6a4cff" />
                <stop offset="100%" stop-color="#3b2a8c" />
              </radialGradient>
              <radialGradient id="brillo" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#b9acff" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#b9acff" stop-opacity="0" />
              </radialGradient>
            </defs>
            <g id="orbitas">
              <circle class="orbita o1" cx="100" cy="110" r="78" />
              <circle class="orbita o2" cx="100" cy="110" r="92" />
            </g>
            <g id="chispas">
              <circle class="chispa" cx="100" cy="24" r="5" />
              <circle class="chispa" cx="176" cy="150" r="4" />
              <circle class="chispa" cx="26" cy="140" r="4" />
            </g>
            <ellipse id="sombra" cx="100" cy="196" rx="46" ry="9" />
            <g id="cuerpo-grupo">
              <circle id="aura" cx="100" cy="104" r="74" fill="url(#brillo)" />
              <path
                id="cuerpo"
                d="M100 30 C150 30 168 74 168 108 C168 156 138 180 100 180 C62 180 32 156 32 108 C32 74 50 30 100 30 Z"
                fill="url(#cuerpo)"
              />
              <g id="cara">
                <ellipse class="ojo" cx="78" cy="104" rx="10" ry="13" />
                <ellipse class="ojo" cx="122" cy="104" rx="10" ry="13" />
                <circle class="pupila" cx="78" cy="106" r="4" />
                <circle class="pupila" cx="122" cy="106" r="4" />
                <path id="boca" d="M84 138 Q100 150 116 138" />
              </g>
            </g>
          </svg>
        </div>
        <div id="nombre-avatar">Nahual</div>
        <div id="estado-avatar">en línea</div>
      </aside>

      <!-- Columna de conversación -->
      <main id="conversacion">
        <div id="mensajes"></div>
        <div id="eleccion" class="oculto"></div>
        <form id="barra-entrada" autocomplete="off">
          <textarea id="entrada" rows="1" placeholder="Escribe lo que necesitas…  (Enter para enviar · Shift+Enter nueva línea)"></textarea>
          <button id="enviar" type="submit" title="Enviar">➤</button>
        </form>
        <div id="barra-estado">
          <span id="e-modo"></span>
          <span id="e-modelo"></span>
          <span id="e-carpeta"></span>
          <span id="e-contexto"></span>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
