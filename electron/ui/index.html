<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Nahual</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Panel del avatar (el personaje 3D se dibuja dentro de #avatar) -->
      <aside id="panel-avatar">
        <div id="avatar" data-estado="quieto"></div>
        <div id="nombre-avatar">Nahual</div>
        <div id="estado-avatar">en línea</div>
      </aside>

      <!-- Columna de conversación -->
      <main id="conversacion">
        <div id="mensajes"></div>
        <div id="eleccion" class="oculto"></div>
        <form id="barra-entrada" autocomplete="off">
          <textarea id="entrada" rows="1" placeholder="Escribe lo que necesitas…  (Enter para enviar · Shift+Enter nueva línea)"></textarea>
          <button id="enviar" type="submit" title="Enviar">➤</button>
        </form>
        <div id="barra-estado">
          <span id="e-modo"></span>
          <span id="e-modelo"></span>
          <span id="e-carpeta"></span>
          <span id="e-contexto"></span>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
    <script type="module" src="avatar3d.js"></script>
  </body>
</html>
